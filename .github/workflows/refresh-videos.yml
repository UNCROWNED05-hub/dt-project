name: Refresh & Benchmark Video Rankings

on:
  schedule:
    # Runs weekly every Sunday at 02:00 UTC (Quota safe: ~3,105 units out of 10,000 daily free tier)
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Quota-Aware Video Refresh Engine
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run refresh:videos

      - name: Commit & Push Updated Video Manifests & Changelog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(video-bot): update ranked YouTube manifests and changelog'
          file_pattern: 'data/videos/*.json'
