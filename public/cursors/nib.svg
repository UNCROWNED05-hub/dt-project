<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Light protective halo outline -->
  <path d="M3 29 L7 22 C6 18 10 14 12 12 L24 24 C22 26 18 30 14 29 Z" 
        fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Pen barrel extension -->
  <path d="M16 8 L24 16 L28 12 L20 4 Z" fill="#0F172A" stroke="#FFFFFF" stroke-width="1"/>
  <!-- Metallic Nib Body -->
  <path d="M3 29 L8 22 C8 17 12 13 15 10 L22 17 C19 20 15 24 10 24 Z" 
        fill="#1E293B" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Gold nib embellishment & slit -->
  <path d="M7 23 C9 18 13 14 15 12 L19 16 C17 18 13 22 8 24 Z" fill="#F59E0B" opacity="0.85"/>
  <!-- Breather hole -->
  <circle cx="12" cy="20" r="1.5" fill="#0F172A" stroke="#FFFFFF" stroke-width="0.8"/>
  <!-- Slit to nib tip (Hotspot at 3, 29) -->
  <line x1="3" y1="29" x2="12" y2="20" stroke="#0F172A" stroke-width="1.2" stroke-linecap="round"/>
</svg>
